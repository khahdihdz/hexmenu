name: Validate Termux scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          bash -n hexmenu.sh
          bash -n install.sh
